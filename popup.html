<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 260px;
            font-family: system-ui, sans-serif;
            background: #0f0f1a;
            color: #e2e2f0;
        }

        header {
            padding: 16px 18px 14px;
            border-bottom: 1px solid #1e1e3a;
        }

        header h1 {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #7c5cfc;
        }

        header p {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        main {
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #444;
            transition: background 0.3s;
            flex-shrink: 0;
        }

        .status-dot.on {
            background: #7c5cfc;
            box-shadow: 0 0 6px #7c5cfc88;
        }

        #label {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
        }

        /* Toggle switch */
        .switch {
            position: relative;
            width: 46px;
            height: 26px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #2a2a3e;
            border: 1px solid #333;
            border-radius: 26px;
            cursor: pointer;
            transition: background 0.25s, border-color 0.25s;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: #888;
            border-radius: 50%;
            transition: transform 0.25s, background 0.25s;
        }

        input:checked+.slider {
            background: #4a1fa8;
            border-color: #7c5cfc;
        }

        input:checked+.slider::before {
            transform: translateX(20px);
            background: #fff;
        }

        .mode-row {
            padding: 0 18px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .mode-row label {
            font-size: 11px;
            color: #666;
            flex-shrink: 0;
        }

        #debugMode {
            flex: 1;
            background: #2a2a3e;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e2e2f0;
            font-size: 12px;
            padding: 4px 8px;
            cursor: pointer;
            outline: none;
        }

        #debugMode:focus {
            border-color: #7c5cfc;
        }

        #hint {
            padding: 0 18px 14px;
            font-size: 10px;
            color: #555;
            line-height: 1.4;
        }

        footer {
            padding: 8px 18px 12px;
            font-size: 10px;
            color: #333;
            border-top: 1px solid #1e1e3a;
        }
    </style>
</head>

<body>
    <header>
        <h1>Odoo Debug</h1>
        <p>dev.odoo.com &amp; localhost</p>
    </header>
    <main>
        <span class="status-dot" id="dot"></span>
        <span id="label">Laden…</span>
        <label class="switch">
            <input type="checkbox" id="toggle">
            <span class="slider"></span>
        </label>
    </main>
    <div class="mode-row">
        <label for="debugMode">Mode</label>
        <select id="debugMode">
            <option value="default">default</option>
            <option value="assets">assets</option>
            <option value="tests">tests</option>
        </select>
    </div>
    <p id="hint"></p>
    <footer>debug=&#x2665; only on dev &amp; local</footer>
    <script src="popup.js"></script>
</body>

</html>
