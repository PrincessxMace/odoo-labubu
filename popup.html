<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 220px;
            padding: 20px;
            font-family: system-ui, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
        }

        h1 {
            font-size: 13px;
            font-weight: 600;
            color: #a78bfa;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #label {
            font-size: 14px;
        }

        /* Toggle switch */
        .switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #444;
            border-radius: 24px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            left: 3px;
            top: 3px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        input:checked+.slider {
            background: #7c3aed;
        }

        input:checked+.slider::before {
            transform: translateX(20px);
        }
    </style>
</head>

<body>
    <h1>Odoo Debug Labubu</h1>
    <div class="row">
        <span id="label">Laden…</span>
        <label class="switch">
            <input type="checkbox" id="toggle">
            <span class="slider"></span>
        </label>
    </div>
    <script src="popup.js"></script>
</body>

</html>
